name: Rebuild and verify portfolio
on: [push, workflow_dispatch]
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate reports and validate outputs
        run: python reproduce.py
      - uses: actions/upload-artifact@v4
        with:
          name: marketing-analytics-reports
          path: |
            **/results/*.csv
            **/results/*.log
            **/report.html
            index.html

